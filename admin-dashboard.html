<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Mapa de Cases</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: linear-gradient(135deg, hsl(190,30%,12%), hsl(260,20%,8%)); font-family: 'Inter', sans-serif; color:#eee; }
    .container { max-width: 960px; margin: 2rem auto; }
    h1 { text-align:center; margin-bottom:1.5rem; }
    .section { background:rgba(255,255,255,0.06); padding:1rem; border-radius:8px; margin-bottom:1.5rem; }
    .item { border-bottom:1px solid rgba(255,255,255,0.1); padding:0.5rem 0; display:flex; justify-content:space-between; align-items:center; }
    .item:last-child { border:none; }
    button { padding:0.4rem 0.8rem; border:none; border-radius:4px; cursor:pointer; }
    .approve { background:hsl(120,50%,40%); color:#fff; }
    .reject { background:hsl(0,50%,40%); color:#fff; margin-left:0.5rem; }
    .error { color:#ff6b6b; margin-top:0.5rem; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:0.75rem 0.5rem; border-bottom:1px solid rgba(255,255,255,0.1); text-align:left; }
    th { color:#9ed8ff; font-size:0.8rem; text-transform:uppercase; }
    .details { background:#2563eb; color:#fff; margin-left:0.5rem; }
    dialog { max-width:620px; width:90%; border:0; border-radius:10px; background:#1d2930; color:#eee; padding:1.25rem; }
    dialog::backdrop { background:rgba(0,0,0,.7); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Painel Admin</h1>
    <div id="errorMsg" class="error"></div>
    <section class="section" id="municipalitiesSection">
      <h2>Municípios Pendentes</h2>
      <div id="municipalitiesList">Carregando...</div>
    </section>
    <section class="section" id="casesSection">
      <h2>Solicitações de Cases</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Case</th><th>Município</th><th>Status</th><th>Ações</th></tr></thead>
          <tbody id="casesList"><tr><td colspan="5">Carregando...</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>
  <dialog id="caseDetailsDialog"><button onclick="document.getElementById('caseDetailsDialog').close()">Fechar</button><h2 id="caseDetailsTitle"></h2><div id="caseDetailsBody"></div></dialog>
  <script src="admin.js"></script>
</body>
</html>
